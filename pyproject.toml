[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-lifecycle"
version = "0.3.1"
description = "Git-native workspace acceptance, completion and retirement"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/yasuyuki/workspace-lifecycle"

[project.scripts]
workspace-lifecycle = "workspace_lifecycle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
