name: CI
on: [push, pull_request]
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the wheel outside checkout
        run: python -B tests/run.py --wheel dist/*.whl
  # One saturated 4-vCPU Windows runner took about 16 minutes for the suite (#37, #62).
  # With four shards the slowest test step still took 290-330 s against about
  # 40-70 s of setup per shard, and finish waits for this job twice (#37).
  windows-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: windows shard ${{ matrix.shard }}/8
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Test the wheel outside checkout
        shell: bash
        run: python -B tests/run.py --wheel dist/*.whl --shard ${{ matrix.shard }}/8 --report "$RUNNER_TEMP/timings.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings.json
  windows:
    name: package (windows-latest, 3.14)
    needs: windows-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.windows-shard.result }}" = success
