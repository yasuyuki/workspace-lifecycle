name: CI
on: [push, pull_request]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Git's bin\git.exe relaunches mingw64\bin\git.exe for every call, and
      # the tests make tens of thousands of Git calls.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Git\mingw64\bin"
      - run: python -m pip install build twine
      - run: python -m build
      - shell: bash
        run: python -m twine check --strict dist/*
      - name: Install and test outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/lifecycle-runtime"
          if [ "$RUNNER_OS" = Windows ]; then
            runtime="$RUNNER_TEMP/lifecycle-runtime/Scripts"
          else
            runtime="$RUNNER_TEMP/lifecycle-runtime/bin"
          fi
          "$runtime/python" -m pip install --no-index dist/*.whl
          "$runtime/python" -m pip install pytest==9.1.1 pytest-xdist==3.8.0
          cd "$RUNNER_TEMP"
          "$runtime/workspace-lifecycle" --version
          "$runtime/python" -m pytest -n auto -p no:cacheprovider -v "$GITHUB_WORKSPACE/tests"
