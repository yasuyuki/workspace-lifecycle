name: CI
on: [push, pull_request]
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Git's bin\git.exe relaunches mingw64\bin\git.exe for every call, and
      # the tests make tens of thousands of Git calls.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:ProgramFiles\Git\mingw64\bin"
      - run: python -m pip install build twine
      - run: python -m build
      - shell: bash
        run: python -m twine check --strict dist/*
      - name: Test the wheel outside checkout
        shell: bash
        run: python -B tests/run.py --wheel dist/*.whl
