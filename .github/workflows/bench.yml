name: bench
on: push
jobs:
  spawn:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - shell: python
        run: |
          import os, shutil, subprocess, sys, tempfile, time
          shim = shutil.which("git")
          real = os.path.join(os.path.dirname(os.path.dirname(shim)), "mingw64", "bin", "git.exe")
          print("cpus", os.cpu_count(), "shim", shim, "real", real, os.path.exists(real))
          print("TEMP", tempfile.gettempdir(), "RUNNER_TEMP", os.environ["RUNNER_TEMP"])
          def timed(label, argv, n=200):
              start = time.perf_counter()
              for _ in range(n):
                  subprocess.run(argv, check=True, capture_output=True)
              print(f"{label:32} {1000 * (time.perf_counter() - start) / n:7.1f} ms/call", flush=True)
          timed("python -c pass", [sys.executable, "-c", "pass"], 50)
          for dname, base in (("TEMP", tempfile.gettempdir()), ("RUNNER_TEMP", os.environ["RUNNER_TEMP"])):
              root = tempfile.mkdtemp(dir=base)
              subprocess.run([shim, "init", "-q", root], check=True)
              for gname, git in (("shim", shim), ("mingw64", real)):
                  timed(f"{gname} {dname} rev-parse", [git, "-C", root, "rev-parse", "--show-toplevel"])
                  timed(f"{gname} {dname} status", [git, "-C", root, "status", "--porcelain"])
